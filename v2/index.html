<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>우리학교 메타버스 v2</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#cfe9f8;font-family:sans-serif}
  #scene{width:100%;height:100%;display:block;outline:none}
  .chip{position:fixed;background:rgba(29,53,87,.8);color:#fff;padding:6px 12px;border-radius:9px;font-size:13px;z-index:20}
  #loc{left:10px;top:10px}#fps{right:10px;top:10px}#help{left:10px;bottom:10px;font-size:12px}
</style>
<script type="importmap">
{ "imports": { "three": "../lib/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="scene" tabindex="0"></canvas>
<div id="loc" class="chip">📍 v2 셸</div>
<div id="fps" class="chip"></div>
<div id="help" class="chip">이동 WASD · 시점 마우스(클릭) · 점프 Space · 달리기 Shift</div>
<!-- ?v= 는 캐시 버스터. js를 고치면 이 숫자를 올린다(안 올리면 브라우저가 옛 모듈로 돈다) -->
<script type="module" src="./js/main.js?v=10"></script>
</body>
</html>
