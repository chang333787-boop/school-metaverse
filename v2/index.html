<div id="boot">학교를 짓는 중<i></i><i></i><i></i></div>
<script>/* TITLE-1: 오프닝을 켤 주소면(main.js TITLE_ON과 같은 규칙) 로딩 막을 제목 모양 + 진짜 단계 막대로. window.bootP(비율, 초) = 막대를 그 비율까지(합성기 transition — 월드를 짓느라 주 스레드가 멈춰도 찬다) */
(function () { var q = new URLSearchParams(location.search), s = location.search;
  if (q.get('shot') || q.get('game') || q.get('tour') === '1' || s.indexOf('check=1') >= 0 || s.indexOf('health=1') >= 0 || q.get('title') === '0') return;
  var b = document.getElementById('boot'); b.className = 'ttl-boot';
  b.innerHTML = '<div class="tb-in"><div class="tb-t">정림초에 오신 것을<br>환영합니다!</div><div class="tb-bar"><i></i></div><div class="tb-s">학교를 짓는 중…</div></div>';
  var f = b.querySelector('.tb-bar i');
  window.bootP = function (p, sec) { f.style.transitionDuration = (sec || 0.4) + 's'; f.style.transform = 'scaleX(' + Math.max(0, Math.min(1, p)) + ')'; };
  requestAnimationFrame(function () { window.bootP(0.18, 1.2); });
})();</script>
<script>addEventListener('error', function () { var b = document.getElementById('boot'); if (b) b.remove(); }, true);   /* 모듈을 못 받거나 짓다가 멈추면 막을 걷는다(막 뒤에 멈춘 화면·콘솔 오류가 그대로 보이게) */</script>
<script>setTimeout(function () { var b = document.getElementById('boot'); if (b) b.remove(); }, 20000);   /* 안전판: 막을 걷는 줄이 없는 옛 main.js를 캐시에 가진 브라우저도 20초 뒤엔 걷힌다 */</script>
