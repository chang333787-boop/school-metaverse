<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- PROMO-1(09-29): 홍보판 — 학부모·방문자용 3D 학교 둘러보기(견학 모드만). 코드는 v2/ 그대로 쓰고 window.SM_PROMO로 바꾼다:
     학생 이름표 = 'N학년 친구'(반마다 6명) · ▶ 학교 둘러보기 → 바로 견학 · 🎮 놀이 없음 · 도장 저장 칸 따로. 우리 학교용(모든 놀이) = v2/ -->
<title>정림초등학교 — 3D 학교 둘러보기</title>
<meta name="description" content="정림초등학교를 3D로 걸어 다니며 둘러보는 학교 견학 — 선생님과 안내판에서 우리 학교 이야기와 영상을 만나요.">
<link rel="icon" href="data:,">
<style>
  html,body{margin:0;height:100%;height:100dvh;overflow:hidden;background:#cfe9f8;font-family:sans-serif}
  #scene{width:100%;height:100%;display:block;outline:none}
  .chip{position:fixed;background:rgba(29,53,87,.8);color:#fff;padding:6px 12px;border-radius:9px;font-size:13px;z-index:20}
  #loc{left:10px;top:10px}#fps{right:10px;top:10px}#help{left:10px;bottom:10px;font-size:12px}
  #boot{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#cfe9f8;color:#1d3557;font-size:20px;font-weight:700}
  #boot i{display:inline-block;width:7px;height:7px;margin-left:6px;border-radius:50%;background:#1d3557;will-change:transform,opacity;animation:bootDot 1.2s ease-in-out infinite both}
  #boot i:nth-child(2){animation-delay:.2s}#boot i:nth-child(3){animation-delay:.4s}
  @keyframes bootDot{0%,80%,100%{transform:scale(.4);opacity:.3}40%{transform:scale(1);opacity:1}}
  body.promo #gpick,body.promo #gpick-panel{visibility:hidden!important;pointer-events:none!important}   /* 🎮 놀이 칩은 자리만 남긴다(🏠 처음으로 칩이 그 자리에) */
</style>
<link rel="stylesheet" href="./v2/title.css?v=6">
<link rel="stylesheet" href="./v2/phone.css?v=9">
<script>window.SM_PROMO = true;</script>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.min.js" } }
</script>
</head>
<body class="promo">
<canvas id="scene" tabindex="0"></canvas>
<div id="boot">학교를 짓는 중<i></i><i></i><i></i></div>
<script>/* 오프닝 로딩 막(v2/index.html과 같은 규칙) */
(function () { var q = new URLSearchParams(location.search), s = location.search;
  if (q.get('shot') || q.get('game') || q.get('tour') === '1' || s.indexOf('check=1') >= 0 || s.indexOf('health=1') >= 0 || q.get('title') === '0') return;
  var b = document.getElementById('boot'); b.className = 'ttl-boot';
  b.innerHTML = '<div class="tb-in"><div class="prb tb-prb"><div class="prb-sch"><b>2026</b> 폰 프리 스쿨 실천학교</div><div class="prb-slo"><span>Phone <b class="off">Off</b>,</span><span>RAS <b class="on">On</b>!</span></div></div><div class="tb-t">정림초에 오신 것을<br>환영합니다!</div><div class="tb-bar"><i></i></div><div class="tb-s">학교를 짓는 중…</div></div>';
  var f = b.querySelector('.tb-bar i');
  window.bootP = function (p, sec) { f.style.transitionDuration = (sec || 0.4) + 's'; f.style.transform = 'scaleX(' + Math.max(0, Math.min(1, p)) + ')'; };
  requestAnimationFrame(function () { window.bootP(0.18, 1.2); });
})();</script>
<script>addEventListener('error', function () { var b = document.getElementById('boot'); if (b) b.remove(); }, true);</script>
<script>setTimeout(function () { var b = document.getElementById('boot'); if (b) b.remove(); }, 20000);</script>
<div id="loc" class="chip">📍 정림초등학교</div>
<div id="fps" class="chip"></div>
<div id="help" class="chip">이동 WASD · 시점 마우스(클릭) · 점프 Space · 달리기 Shift · 말 걸기 E · 도감 C · 길 안내 H · 멈춤 P(Esc)</div>
<!-- ?v= 는 캐시 버스터 — v2/index.html의 main.js?v= 와 같은 숫자로 함께 올린다 -->
<script type="module" src="./v2/js/main.js?v=176"></script>
</body>
</html>
