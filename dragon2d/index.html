<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>버크의 드래곤 친구 · 2D</title>
<link rel="icon" href="data:,">
<style>
  :root { --ink:#2b2118; --paper:#f4ead2; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; height:100dvh; overflow:hidden; background:#1d2730; font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:var(--ink); }
  #scene { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; outline:none; }
  #load { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; background:#1d2730; color:var(--paper); font-size:20px; letter-spacing:.02em; }
  .hide { display:none !important; }
  #touch button { position:fixed; z-index:22; width:64px; height:64px; font:700 18px "Noto Sans KR",sans-serif; color:var(--ink); background:rgba(244,234,210,.82); border:2px solid var(--ink); border-radius:16px 20px 14px 22px; touch-action:none; user-select:none; -webkit-user-select:none; }
  #touch button.on { background:#e6c464; }
  #touch .l1 { left:14px; bottom:84px; } #touch .l2 { left:150px; bottom:84px; } #touch .l3 { left:82px; bottom:152px; } #touch .l4 { left:82px; bottom:16px; }
  #touch .r1 { right:160px; bottom:20px; font-size:14px; } #touch .r2 { right:86px; bottom:70px; font-size:15px; } #touch .r3 { right:14px; bottom:130px; } #touch .r4 { right:160px; bottom:96px; font-size:14px; }
</style>
</head>
<body>
<canvas id="scene" tabindex="0"></canvas>
<div id="load">버크로 가는 중…</div>
<script type="module" src="js/main.js?v=1"></script>
</body>
</html>
